name: build

# Manual Windows installer build. Trigger via:
#   gh workflow run build.yml
# Artifacts (MSI + NSIS + portable .exe) are available from the run page.
# Tags still go through `release.yml` for full release publishing.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build MSI + NSIS
        run: pnpm tauri build

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-runway-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-runway-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable .exe
        uses: actions/upload-artifact@v4
        with:
          name: codex-runway-windows-exe
          path: src-tauri/target/release/*.exe
          if-no-files-found: error
          retention-days: 14
